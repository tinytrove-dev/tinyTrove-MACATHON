<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=${mapsAPIKey}&libraries=marker"></script>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      #container { display: flex; flex-direction: column; height: 100%; }
      #map { flex: 1; width: 100%; }
      #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="map"></div>
    </div>
    <div id="loading">Loading map...</div>
    <script>
      let map;
      let markers = [];
      const defaultCenter = { lat: -37.9016, lng: 145.1155 };
      const locations = ${locationsJson};

      function clearMarkers() {
        markers.forEach(marker => marker.setMap(null));
        markers = [];
      }

      async function geocodeAddress(address) {
        const response = await fetch('https://maps.googleapis.com/maps/api/geocode/json?address=' + encodeURIComponent(address) + '&key=${mapsAPIKey}');
        const data = await response.json();
        if (data.results && data.results[0]) {
          return data.results[0].geometry.location;
        }
        return null;
      }

      async function addMarkers(locations) {
        clearMarkers();
        // Geocode all addresses in parallel instead of sequentially
        const geocodePromises = locations.map(loc => 
          geocodeAddress(loc.address)
            .then(position => ({ loc, position, success: true }))
            .catch(() => ({ loc, position: null, success: false }))
        );
        const results = await Promise.all(geocodePromises);
        
        // Add markers for all successfully geocoded locations
        results.forEach(({ loc, position, success }) => {
          if (success && position) {
            const marker = new google.maps.Marker({
              position: position,
              map: map,
              title: loc.title || loc.address
            });
            google.maps.event.addListener(marker, 'click', () => {
              window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'markerClick', location: loc }));
            });
            markers.push(marker);
          }
        });

        // If no markers were geocoded, center on default location
        if (markers.length === 0) {
          map.setCenter(defaultCenter);
        }
      }

      function initMap(center) {
        const mapElement = document.getElementById('map');
        map = new google.maps.Map(mapElement, {
          zoom: 12,
          center: center
        });

        document.getElementById('loading').style.display = 'none';
        
        // Load markers after map is visible
        if (locations.length > 0) {
          addMarkers(locations);
        }
      }

      // Try to get user's location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const userLocation = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            initMap(userLocation);
          },
          (error) => {
            console.error('Geolocation error:', error);
            initMap(defaultCenter);
          }
        );
      } else {
        initMap(defaultCenter);
      }
    </script>
  </body>
</html>
